[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peas"
version = "0.1.0"
description = "PEptideASsembler: uncertainty-aware assembly of de novo peptides (Casanovo, InstaNovo) into protein contigs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michel Moser" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
peas = "peas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/peas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
